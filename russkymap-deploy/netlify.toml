# Конфигурация Netlify для RusskyMap.
# ВАЖНО: этот файл должен лежать В КОРНЕ папки деплоя (рядом с index.html),
# иначе Netlify не найдёт функцию бота.

[build]
  # Папка деплоя и есть корень сайта (index.html лежит рядом с этим файлом).
  publish = "."

[functions]
  # Явно указываем, где искать функции — это гарантирует, что бот определится.
  directory = "netlify/functions"

# Всё, что не файл и не функция, отдаём как index.html (SPA).
# Путь /.netlify/functions/* Netlify не перехватывает — функция работает.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
